name: Lists
options:
  bundleIdPrefix: rocks.barry.lists
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    # Simulator-first: a fresh clone builds with no provisioning profile.
    # `barry ios build --device` layers signing on as xcodebuild overrides.
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  Lists:
    type: application
    platform: iOS
    sources:
      - App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Lists
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Plain HTTP over a tailnet: the service binds loopback and is reached
        # through Caddy, which serves lists.barry.lan with an internal CA the
        # phone does not trust.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: rocks.barry.lists.app
  ListsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: Lists
schemes:
  Lists:
    build:
      targets:
        Lists: all
        ListsTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ListsTests
